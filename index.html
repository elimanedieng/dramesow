
<section id="stock" class="page">
  <div class="title">Gestion du stock</div>
  <p class="sub">Ajoute tes achats et choisis l'unité de chaque produit.</p>

  <div class="card">
    <div class="title">Ajouter un achat au stock</div>

    <div class="field">
      <label>Produit</label>
      <select id="stockItem"></select>
    </div>

    <div class="grid2">
      <div class="field">
        <label>Quantité achetée</label>
        <input id="stockQty" type="number" min="0.001"
          step="0.001" placeholder="Ex. 5">
      </div>

      <div class="field">
        <label>Unité</label>
        <select id="stockUnit">
          <option value="kg">Kg</option>
          <option value="g">Gramme (g)</option>
          <option value="litre">Litre</option>
          <option value="ml">Millilitre (ml)</option>
          <option value="sac">Sac</option>
          <option value="carton">Carton</option>
          <option value="sachet">Sachet</option>
          <option value="boîte">Boîte</option>
          <option value="paquet">Paquet</option>
          <option value="bidon">Bidon</option>
          <option value="bouteille">Bouteille</option>
          <option value="pièce">Pièce</option>
          <option value="unité">Unité</option>
          <option value="custom">Autre unité</option>
        </select>
      </div>
    </div>

    <div class="field hidden" id="customUnitBox">
      <label>Nom de l'unité personnalisée</label>
      <input id="customUnit" placeholder="Ex. pot, bassine, seau">
    </div>

    <button class="btn" onclick="addStock()">
      Enregistrer l'achat
    </button>
  </div>

  <div class="card">
    <div class="title">Ajouter un nouveau produit</div>

    <div class="field">
      <label>Nom du produit</label>
      <input id="newIng" placeholder="Ex. Huile, sucre, yaourt">
    </div>

    <div class="field">
      <label>Unité de mesure</label>
      <select id="newUnit">
        <option value="kg">Kg</option>
        <option value="g">Gramme (g)</option>
        <option value="litre">Litre</option>
        <option value="ml">Millilitre (ml)</option>
        <option value="sac">Sac</option>
        <option value="carton">Carton</option>
        <option value="sachet">Sachet</option>
        <option value="boîte">Boîte</option>
        <option value="paquet">Paquet</option>
        <option value="bidon">Bidon</option>
        <option value="bouteille">Bouteille</option>
        <option value="pièce">Pièce</option>
        <option value="unité">Unité</option>
      </select>
    </div>

    <button class="btn light" onclick="addIngredient()">
      + Ajouter le produit
    </button>
  </div>

  <div class="card">
    <div class="title">Stock disponible</div>
    <div id="stockList"></div>
  </div>
</section>
